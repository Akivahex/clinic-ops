---
- hosts: webserver
  become: yes
  gather_facts: yes

  vars:
    # --- App web simple (Nginx) ---
    app_dir: /opt/app/simple-nginx
    build_ctx_src: "{{ playbook_dir }}/../../apps/simple-nginx/"
    web_image: "localhost/simple-nginx:1.0"
    web_container: "web-app"
    web_host_port: "80"
    web_container_port: "8080"

    # --- n8n ---
    n8n_image: "docker.io/n8nio/n8n:1.112.6"
    n8n_container: "n8n"
    n8n_data_dir: "/opt/n8n/.n8n"
    n8n_bind: "127.0.0.1:5678:5678"
    GENERIC_TIMEZONE: "Europe/Berlin"
    N8N_PORT: "5678"
    N8N_METRICS: "false"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_DISABLE_PRODUCTION_MAIN_MENU: "true"

  pre_tasks:
    - name: Actualizar caché de apt
      apt:
        update_cache: yes
      changed_when: false

    - name: Paquetes base (Podman, UFW, curl)
      apt:
        name:
          - podman
          - ufw
          - curl
        state: present

    - name: Asegurar que Docker está deshabilitado (si existe)
      shell: |
        systemctl disable --now docker docker.socket 2>/dev/null || true
      changed_when: false

  tasks:
    ##################################################################
    # 1) WEB: construir imagen y desplegar como servicio systemd
    ##################################################################
    - name: Crear directorio de app web
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copiar fuentes de la app (contexto de build)
      copy:
        src: "{{ build_ctx_src }}"
        dest: "{{ app_dir }}/"

    - name: Normalizar FROM del Dockerfile a FQDN (nginx -> docker.io/library/nginx)
      replace:
        path: "{{ app_dir }}/Dockerfile"
        regexp: '^FROM\s+nginx:(\S+)'
        replace: 'FROM docker.io/library/nginx:\1'

    - name: Build de la imagen (solo si no existe)
      shell: |
        podman image exists "{{ web_image }}" || podman build -t "{{ web_image }}" "{{ app_dir }}"

    - name: Crear/actualizar contenedor web (host:{{ web_host_port }} -> {{ web_container_port }})
      shell: |
        podman create --replace --name "{{ web_container }}" \
          --restart=always -p {{ web_host_port }}:{{ web_container_port }} "{{ web_image }}"

    - name: Generar unidad systemd del contenedor web (una vez)
      shell: |
        podman generate systemd --name "{{ web_container }}" --files
      args:
        chdir: "/etc/systemd/system"
        creates: "/etc/systemd/system/container-{{ web_container }}.service"

    - name: Habilitar e iniciar servicio web
      systemd:
        name: "container-{{ web_container }}.service"
        daemon_reload: yes
        enabled: yes
        state: started

    ##################################################################
    # 2) UFW: abrir solo lo necesario
    ##################################################################
    - name: Comprobar estado de UFW
      shell: ufw status
      register: ufw_status
      changed_when: false

    - name: Habilitar UFW si está inactivo
      shell: ufw --force enable
      when: "'Status: inactive' in ufw_status.stdout"

    - name: Reglas UFW estándar (22,80,443)
      shell: |
        ufw status | grep -q '^22/tcp'  || ufw allow 22/tcp
        ufw status | grep -q '^80/tcp'  || ufw allow 80/tcp
        ufw status | grep -q '^443/tcp' || ufw allow 443/tcp
      changed_when: false

    ##################################################################
    # 3) n8n: contenedor + systemd (solo localhost:5678)
    ##################################################################
    - name: Crear directorio de datos n8n (propietario 1000)
      file:
        path: "{{ n8n_data_dir }}"
        state: directory
        mode: "0755"
        owner: "1000"
        group: "1000"
        recurse: yes

    - name: Crear/actualizar contenedor n8n (127.0.0.1:5678)
      shell: |
        podman create --replace --name "{{ n8n_container }}" --restart=always \
          -p "{{ n8n_bind }}" \
          -v "{{ n8n_data_dir }}:/home/node/.n8n" \
          -e GENERIC_TIMEZONE={{ GENERIC_TIMEZONE }} \
          -e N8N_PORT={{ N8N_PORT }} \
          -e N8N_METRICS={{ N8N_METRICS }} \
          -e N8N_DIAGNOSTICS_ENABLED={{ N8N_DIAGNOSTICS_ENABLED }} \
          -e N8N_DISABLE_PRODUCTION_MAIN_MENU={{ N8N_DISABLE_PRODUCTION_MAIN_MENU }} \
          "{{ n8n_image }}"

    - name: Generar unidad systemd de n8n (una vez)
      shell: |
        podman generate systemd --name "{{ n8n_container }}" --files
      args:
        chdir: "/etc/systemd/system"
        creates: "/etc/systemd/system/container-{{ n8n_container }}.service"

    - name: Habilitar e iniciar servicio n8n
      systemd:
        name: "container-{{ n8n_container }}.service"
        daemon_reload: yes
        enabled: yes
        state: started

    ##################################################################
    # 4) Verificaciones amigables
    ##################################################################
    - name: Estado servicios (web y n8n)
      shell: |
        echo -n "web: ";  systemctl is-active container-{{ web_container }}.service  || true
        echo -n "n8n: ";  systemctl is-active container-{{ n8n_container }}.service || true
      register: svc_states
      changed_when: false

    - name: Puertos escuchando (80 y 5678)
      shell: "ss -tulpn | egrep ':(80|5678) ' || true"
      register: listeners
      changed_when: false

    - name: HTTP local a web (127.0.0.1:80)
      shell: "curl -sI http://127.0.0.1/ | head -n1 || true"
      register: http_web
      changed_when: false

    - name: HTTP local a n8n (127.0.0.1:5678)
      shell: "curl -sI http://127.0.0.1:5678/ | head -n1 || true"
      register: http_n8n
      changed_when: false

    - name: Mostrar resultados
      debug:
        msg:
          - "Servicios: {{ svc_states.stdout_lines | default([]) }}"
          - "Sockets:   {{ listeners.stdout_lines   | default([]) }}"
          - "Web:       {{ http_web.stdout | default('') | trim }}"
          - "n8n:       {{ http_n8n.stdout | default('') | trim }}"
