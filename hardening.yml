---
- hosts: webserver
  become: yes
  gather_facts: yes

  vars:
    app_dir: /opt/app/simple-nginx
    image_name: localhost/simple-nginx
    image_tag: "1.0"
    image_ref: "{{ image_name }}:{{ image_tag }}"
    container_name: web-app
    service_unit: "container-{{ container_name }}.service"
    host_port: "80"
    container_port: "8080"

  pre_tasks:
    - name: Actualizar caché APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

  tasks:
    # --- BASE: Podman y utilidades ---
    - name: Instalar Podman y utilidades
      apt:
        name:
          - podman
          - containernetworking-plugins
          - jq
          - ufw
        state: present

    # --- Deshabilitar Docker si existe (no lo usamos) ---
    - name: Detener/Deshabilitar Docker (si está instalado)
      service:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - docker
        - docker.socket
      ignore_errors: yes

    # --- Limpiar units legacy que daban error (si existen) ---
    - name: Deshabilitar units legacy (si existen)
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - simple-nginx-podman.service
        - container-simple-nginx-container.service
      ignore_errors: yes

    - name: Eliminar files de units legacy (si existen)
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/simple-nginx-podman.service
        - /etc/systemd/system/container-simple-nginx-container.service
      ignore_errors: yes

    - name: Recargar systemd y limpiar fallidos
      shell: |
        systemctl daemon-reload
        systemctl reset-failed
      args:
        executable: /bin/bash
      changed_when: false

    # --- Preparar directorio app y fuentes ---
    - name: Crear directorio de la app
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copiar fuentes de la app (Dockerfile + nginx.conf + index.html)
      copy:
        src: ./simple-nginx/
        dest: "{{ app_dir }}/"

    # --- Asegurar FROM plenamente calificado para Podman ---
    - name: Forzar FROM plenamente calificado para Podman
      replace:
        path: "{{ app_dir }}/Dockerfile"
        regexp: '^FROM\s+nginx:'
        replace: 'FROM docker.io/library/nginx:'

    # --- Construir imagen con Podman ---
    - name: Construir imagen (podman build)
      command: >
        podman build -t {{ image_ref }} {{ app_dir }}
      register: build_out
      changed_when: "'Successfully tagged' in (build_out.stdout | default('')) or 'COMMIT' in (build_out.stdout | default(''))"

    # --- Idempotencia: parar servicio si existe ---
    - name: Parar servicio si existe
      systemd:
        name: "{{ service_unit }}"
        state: stopped
      ignore_errors: yes

    # --- Limpiar contenedor previo (si existe) ---
    - name: Borrar contenedor antiguo si existiera
      command: podman rm -f {{ container_name }}
      register: rm_out
      failed_when: false
      changed_when: "'no such container' not in (rm_out.stderr | default(''))"

    # --- Crear contenedor en estado created (con --replace) ---
    - name: Crear contenedor (host:{{ host_port }} -> contenedor:{{ container_port }})
      command: >
        podman create --replace --name {{ container_name }}
        --restart=always
        -p {{ host_port }}:{{ container_port }}
        {{ image_ref }}
      register: create_out
      failed_when: create_out.rc not in [0]
      changed_when: true

    # --- Generar unit systemd desde el contenedor ---
    - name: Generar unit systemd (podman generate systemd)
      command: >
        podman generate systemd --name {{ container_name }} --files --new --restart-policy=always
      args:
        chdir: /tmp
      register: gen_out

    - name: Copiar unit a /etc/systemd/system
      copy:
        src: "/tmp/{{ service_unit }}"
        dest: "/etc/systemd/system/{{ service_unit }}"
        remote_src: true
        mode: "0644"

    # --- Activar servicio ---
    - name: Recargar systemd
      systemd:
        daemon_reload: yes

    - name: Habilitar e iniciar servicio
      systemd:
        name: "{{ service_unit }}"
        enabled: yes
        state: started

    # --- UFW mínimo seguro ---
    - name: Habilitar UFW si está inactivo
      shell: |
        ufw status | grep -q "Status: active" || ufw --force enable
      args:
        executable: /bin/bash
      changed_when: false

    - name: Políticas base UFW
      shell: |
        ufw status verbose | grep -q "Default: deny (incoming), allow (outgoing)" || (
          ufw default deny incoming && ufw default allow outgoing
        )
      args:
        executable: /bin/bash
      changed_when: false

    - name: Permitir SSH/HTTP/HTTPS
      shell: ufw allow {{ item }}
      args:
        executable: /bin/bash
      loop:
        - 22/tcp
        - 80/tcp
        - 443/tcp
      changed_when: false

    # --- Comprobaciones ---
    - name: Esperar a que el puerto {{ host_port }} responda
      wait_for:
        host: "127.0.0.1"
        port: "{{ host_port }}"
        state: started
        timeout: 30

    - name: Probar HTTP local
      shell: curl -sI http://127.0.0.1/ | head -n1
      args:
        executable: /bin/bash
      register: curl_check
      changed_when: false

    - name: Mostrar estado HTTP
      debug:
        msg: "{{ curl_check.stdout }}"
